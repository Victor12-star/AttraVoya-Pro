packages:
  - 'apps/*'
  - 'packages/*'
# Enforce the 24-hour package-maturity gate without fallback or missing-time bypass.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
allowBuilds:
  '@prisma/engines@7.9.1': true
  'argon2@0.44.0': true
  'dtrace-provider@0.8.8': false
  'prisma@7.9.1': true
  'sharp@0.35.5': true
  'unrs-resolver@1.12.2': false

overrides:
  # Temporary security pins for transitive dependencies. Keep these here (not
  # package.json) because pnpm 11 reads workspace settings from pnpm-workspace.yaml.
  '@fastify/static': '10.1.1'
  'fast-uri@>=3.0.0 <4.0.0': '3.1.8'
  'fast-uri@>=4.0.0 <5.0.0': '4.2.1'
  'deepmerge-ts': '8.0.1'
  'source-map-js': '1.2.2'
  'compression': '1.8.2'
  'shell-quote': '1.11.0'
  'sharp': '0.35.5'
  'node-forge': 'workspace:1.4.1-0'
  'braces': 'workspace:3.0.4-attravoya.0'
  'mysql2': '3.24.3'
  'js-yaml@>=3.0.0 <3.15.2': '3.15.2'
  'js-yaml@>=4.0.0 <4.3.2': '4.3.2'
  'joi@>=17.2.0 <17.13.7': '17.13.8'
  'brace-expansion@<2.0.0': '1.1.21'
  'brace-expansion@>=2.0.0 <3.0.0': '2.1.7'
  'brace-expansion@>=3.0.0 <4.0.0': '3.0.9'
  'brace-expansion@>=4.0.0 <6.0.0': '5.0.12'
  # These exact legacy plugins are registered through @eslint/compat.
  # Remove each override when that upstream release declares ESLint 10 support.
  'eslint-plugin-jsx-a11y@6.10.2>eslint': '>=10.9.0 <11'
  'eslint-plugin-react@7.37.5>eslint': '>=10.9.0 <11'
  'eslint-plugin-react-native@5.0.0>eslint': '>=10.9.0 <11'

# Intentional, scoped exemption from the 24-hour maturity gate.
# Expo publishes tightly-coupled SDK-57 patch sets (expo + @expo/* + expo-*) that
# `expo install --check` mandates as a unit. These are vendor-owned infra adopted
# day-of by Expo itself; exempting them keeps the SDK consistent without weakening
# the gate for third-party deps. Remove this block to restore the strict gate.
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.20'
  - '@expo/env@2.4.3'
  - '@expo/fingerprint@0.20.11'
  - '@expo/metro-config@57.0.12'
  - expo-constants@57.0.16
  - expo-font@57.0.2
  - expo@57.0.18
