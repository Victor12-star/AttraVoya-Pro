name: Phase 9T diagnostic

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  generate:
    name: Generate exact Phase 9T fixes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install current lockfile
        run: pnpm install --frozen-lockfile

      - name: Generate formatter and dependency-security fixes
        run: |
          pnpm exec prettier --write \
            apps/web/src/features/emergency/travel-emergency-copy.js \
            apps/web/src/features/emergency/travel-emergency-mode.jsx
          python3 - <<'PY'
          from pathlib import Path

          path = Path('pnpm-workspace.yaml')
          text = path.read_text(encoding='utf-8')
          marker = "  'mysql2': '3.24.3'\n"
          additions = (
              "  'js-yaml@>=3.0.0 <3.15.2': '3.15.2'\n"
              "  'js-yaml@>=4.0.0 <4.3.2': '4.3.2'\n"
          )
          if additions not in text:
              if marker not in text:
                  raise SystemExit('Expected pnpm override marker was not found.')
              text = text.replace(marker, marker + additions, 1)
              path.write_text(text, encoding='utf-8')
          PY
          pnpm install --lockfile-only --no-frozen-lockfile

      - name: Upload exact generated files
        uses: actions/upload-artifact@v4
        with:
          name: phase-9t-generated-fixes
          if-no-files-found: error
          retention-days: 1
          path: |
            apps/web/src/features/emergency/travel-emergency-copy.js
            apps/web/src/features/emergency/travel-emergency-mode.jsx
            pnpm-workspace.yaml
            pnpm-lock.yaml
