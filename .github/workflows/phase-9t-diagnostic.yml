name: Phase 9T diagnostic

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  generate:
    name: Generate and apply exact Phase 9T fixes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install current lockfile
        run: pnpm install --frozen-lockfile

      - name: Generate formatter and dependency-security fixes
        run: |
          pnpm exec prettier --write \
            apps/web/src/features/emergency/travel-emergency-copy.js \
            apps/web/src/features/emergency/travel-emergency-mode.jsx
          python3 - <<'PY'
          from pathlib import Path

          path = Path('pnpm-workspace.yaml')
          text = path.read_text(encoding='utf-8')
          marker = "  'mysql2': '3.24.3'\n"
          additions = (
              "  'js-yaml@>=3.0.0 <3.15.2': '3.15.2'\n"
              "  'js-yaml@>=4.0.0 <4.3.2': '4.3.2'\n"
          )
          if additions not in text:
              if marker not in text:
                  raise SystemExit('Expected pnpm override marker was not found.')
              text = text.replace(marker, marker + additions, 1)
              path.write_text(text, encoding='utf-8')
          PY
          pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify generated fixes
        run: |
          pnpm exec prettier --check \
            apps/web/src/features/emergency/travel-emergency-copy.js \
            apps/web/src/features/emergency/travel-emergency-mode.jsx
          pnpm audit --prod --audit-level=high
          git diff --check

      - name: Commit generated fixes to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/features/emergency/travel-emergency-copy.js \
            apps/web/src/features/emergency/travel-emergency-mode.jsx \
            pnpm-workspace.yaml \
            pnpm-lock.yaml
          git diff --cached --check
          git commit -m "Phase 9T: format emergency UI and patch js-yaml"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
