name: Phase 9V formatter

on:
  push:
    branches:
      - feature/phase-9v-grounded-travel-assistant

permissions:
  contents: write

concurrency:
  group: phase-9v-formatter
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/phase-9v-grounded-travel-assistant

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Phase 9V files
        run: >-
          pnpm exec prettier --write
          apps/web/src/features/language/grounded-travel-assistant-copy.js
          apps/web/src/features/language/grounded-travel-assistant.jsx
          apps/web/tests/unit/grounded-travel-assistant.test.jsx

      - name: Commit formatting only when needed
        shell: bash
        run: |
          if git diff --quiet -- \
            apps/web/src/features/language/grounded-travel-assistant-copy.js \
            apps/web/src/features/language/grounded-travel-assistant.jsx \
            apps/web/tests/unit/grounded-travel-assistant.test.jsx; then
            echo "Phase 9V files are already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/web/src/features/language/grounded-travel-assistant-copy.js \
            apps/web/src/features/language/grounded-travel-assistant.jsx \
            apps/web/tests/unit/grounded-travel-assistant.test.jsx
          git commit -m "Phase 9V: apply repository formatting"
          git push origin HEAD:feature/phase-9v-grounded-travel-assistant
