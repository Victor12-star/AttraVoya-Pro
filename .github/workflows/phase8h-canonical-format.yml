name: Phase 8H canonical formatter

on:
  push:
    branches:
      - feature/phase-8h-planner-candidate-evidence-ui

permissions:
  contents: write

jobs:
  format-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/phase-8h-planner-candidate-evidence-ui

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply canonical Prettier output
        run: |
          pnpm exec prettier --write \
            apps/web/src/features/planner/candidate-evidence-copy.js \
            apps/web/src/features/planner/candidate-evidence-section.jsx \
            apps/web/tests/unit/candidate-evidence-section.test.jsx

      - name: Remove temporary formatting helpers
        run: |
          rm apps/web/tests/unit/phase8h-format-dump.test.js
          rm .github/workflows/phase8h-canonical-format.yml

      - name: Verify canonical files
        run: |
          pnpm exec prettier --check \
            apps/web/src/features/planner/candidate-evidence-copy.js \
            apps/web/src/features/planner/candidate-evidence-section.jsx \
            apps/web/tests/unit/candidate-evidence-section.test.jsx
          git diff --check

      - name: Commit canonical result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(web): apply canonical Phase 8H formatting"
          git push origin HEAD:feature/phase-8h-planner-candidate-evidence-ui
