name: Phase 10C branch patch

on:
  push:
    branches:
      - feature/phase-10c-provider-total-deadline

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/phase-10c-provider-total-deadline

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply bounded total provider deadline
        run: python scripts/phase-10c-apply.py

      - name: Format Phase 10C files
        run: pnpm exec prettier --write apps/server/src/integrations/http/provider-http-client.js apps/server/src/integrations/http/provider-http-client-deadline.test.js

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run focused provider deadline tests
        run: pnpm --filter @attravoya/server exec vitest run src/integrations/http/provider-http-client-deadline.test.js --passWithNoTests

      - name: Commit exact Phase 10C patch
        run: |
          if git diff --quiet -- apps/server/src/integrations/http/provider-http-client.js apps/server/src/integrations/http/provider-http-client-deadline.test.js; then
            echo "Phase 10C patch made no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/integrations/http/provider-http-client.js apps/server/src/integrations/http/provider-http-client-deadline.test.js
          git commit -m "Phase 10C: bound total provider request duration"
          git push origin HEAD:feature/phase-10c-provider-total-deadline
