name: Temporary Phase 10CY formatter

on:
  push:
    branches:
      - phase-10cy-revenuecat-webhook-verification

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Phase 10CY files
        run: |
          pnpm exec prettier --write \
            apps/server/src/modules/payments/payments.revenuecat-verification.js \
            apps/server/src/modules/payments/payments.revenuecat-verification.test.js \
            docs/SUBSCRIPTION-ENTITLEMENTS.md

      - name: Commit formatting
        run: |
          if git diff --quiet -- \
            apps/server/src/modules/payments/payments.revenuecat-verification.js \
            apps/server/src/modules/payments/payments.revenuecat-verification.test.js \
            docs/SUBSCRIPTION-ENTITLEMENTS.md; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/server/src/modules/payments/payments.revenuecat-verification.js \
            apps/server/src/modules/payments/payments.revenuecat-verification.test.js \
            docs/SUBSCRIPTION-ENTITLEMENTS.md
          git commit -m "chore: format Phase 10CY RevenueCat files"
          git push origin HEAD:phase-10cy-revenuecat-webhook-verification
