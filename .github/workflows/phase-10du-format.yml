name: Temporary Phase 10DU formatting

on:
  push:
    branches:
      - phase-10du-mobile-offering-prices
    paths:
      - apps/mobile/src/features/subscriptions/subscription-status-screen.jsx
      - apps/mobile/tests/mobile-subscription-status.test.jsx
      - .github/workflows/phase-10du-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: phase-10du-mobile-offering-prices

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Phase 10DU files
        run: |
          pnpm exec prettier --write             apps/mobile/src/features/subscriptions/subscription-status-screen.jsx             apps/mobile/tests/mobile-subscription-status.test.jsx

      - name: Commit formatting
        run: |
          if git diff --quiet --             apps/mobile/src/features/subscriptions/subscription-status-screen.jsx             apps/mobile/tests/mobile-subscription-status.test.jsx; then
            echo "Files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/mobile/src/features/subscriptions/subscription-status-screen.jsx             apps/mobile/tests/mobile-subscription-status.test.jsx
          git commit -m "style: format Phase 10DU mobile billing UI"
          git push origin HEAD:phase-10du-mobile-offering-prices
