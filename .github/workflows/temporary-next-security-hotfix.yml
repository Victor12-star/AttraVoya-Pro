name: Temporary Next.js lockfile refresh

on:
  push:
    branches:
      - hotfix-next-16-3-8-security

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v5
        with:
          ref: hotfix-next-16-3-8-security

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Refresh lockfile from package manifests
        run: pnpm install --lockfile-only

      - name: Commit generated lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already matches package manifests."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "security: refresh lockfile for Next.js 16.3.8"
          git push origin HEAD:hotfix-next-16-3-8-security
