name: Temporary Owner Directory Formatting
on:
  push:
    branches:
      - feat/owner-user-directory
permissions:
  contents: write
jobs:
  format-directory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed directory files
        run: |
          pnpm exec prettier --write \
            apps/server/src/modules/users/admin-directory.repository.js \
            apps/server/src/modules/users/admin-directory.controller.js \
            apps/server/src/modules/users/admin-directory.test.js \
            apps/server/src/modules/users/users.routes.js \
            apps/server/src/modules/users/users.schema.js \
            apps/server/src/app.js \
            apps/admin/src/app/api/admin/users/route.js \
            apps/admin/src/features/users/admin-user-directory.jsx \
            apps/admin/src/app/dashboard/users/page.jsx \
            apps/admin/src/app/globals.css \
            apps/admin/tests/unit/admin-user-directory.test.jsx
      - name: Commit format-only changes
        run: |
          git add -- \
            apps/server/src/modules/users/admin-directory.repository.js \
            apps/server/src/modules/users/admin-directory.controller.js \
            apps/server/src/modules/users/admin-directory.test.js \
            apps/server/src/modules/users/users.routes.js \
            apps/server/src/modules/users/users.schema.js \
            apps/server/src/app.js \
            apps/admin/src/app/api/admin/users/route.js \
            apps/admin/src/features/users/admin-user-directory.jsx \
            apps/admin/src/app/dashboard/users/page.jsx \
            apps/admin/src/app/globals.css \
            apps/admin/tests/unit/admin-user-directory.test.jsx
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(admin): format owner directory'
          git push origin HEAD:feat/owner-user-directory
