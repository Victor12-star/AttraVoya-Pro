name: One-time subscription formatting

on:
  push:
    branches:
      - phase-10ca-web-subscription-status

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Phase 10CA files
        run: >-
          pnpm exec prettier --write
          apps/web/src/features/subscriptions/subscription-status-copy.js
          apps/web/src/features/subscriptions/subscription-status-page.jsx
          apps/web/tests/unit/subscription-status-page.test.jsx

      - name: Commit exact formatter output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/web/src/features/subscriptions/subscription-status-copy.js             apps/web/src/features/subscriptions/subscription-status-page.jsx             apps/web/tests/unit/subscription-status-page.test.jsx
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "Phase 10CA: apply repository formatter"
          git push origin HEAD:phase-10ca-web-subscription-status
