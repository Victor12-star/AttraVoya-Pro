name: Phase 7 formatting

on:
  push:
    branches:
      - phase-7a-destination-search

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier output
        run: |
          pnpm exec prettier --write \
            apps/server/src/tests/integration/provider-routes.test.js \
            packages/api-client/src/client.js \
            packages/api-client/tests/client.test.js
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/server/src/tests/integration/provider-routes.test.js \
            packages/api-client/src/client.js \
            packages/api-client/tests/client.test.js
          git commit -m "style: format Phase 7A destination search"
          git push origin HEAD:phase-7a-destination-search
