name: Temporary First Owner Formatting

on:
  push:
    branches:
      - feat/first-owner-provisioning

permissions:
  contents: write

jobs:
  format-first-owner:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format first-owner changes
        run: |
          pnpm exec prettier --write \
            packages/database/src/first-owner-provisioning.js \
            packages/database/src/first-owner-provisioning.test.js \
            packages/database/scripts/provision-first-owner.js \
            packages/database/package.json \
            docs/FIRST-OWNER-SETUP.md
      - name: Commit formatting changes
        run: |
          git add -- \
            packages/database/src/first-owner-provisioning.js \
            packages/database/src/first-owner-provisioning.test.js \
            packages/database/scripts/provision-first-owner.js \
            packages/database/package.json \
            docs/FIRST-OWNER-SETUP.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(owner): apply repository Prettier formatting'
          git push origin HEAD:feat/first-owner-provisioning
