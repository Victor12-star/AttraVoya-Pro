name: Session controls formatting diagnostic

on:
  push:
    branches:
      - phase-10u-session-controls

permissions:
  contents: read

jobs:
  prettier:
    name: Show session controls formatting diff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show Prettier diff
        run: |
          pnpm exec prettier apps/server/src/modules/auth/auth.session-controls.test.js --write
          git diff -- apps/server/src/modules/auth/auth.session-controls.test.js
