name: Temporary planner format repair
on:
  push:
    branches:
      - feat/planner-independent-city-briefs
    paths:
      - .github/workflows/temp-city-prettier.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: pnpm exec prettier --write apps/web/src/features/planner/budget-planner-page.jsx packages/validation/src/budget-planner.js
      - name: Commit formatting
        run: |
          if ! git diff --quiet -- apps/web/src/features/planner/budget-planner-page.jsx packages/validation/src/budget-planner.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/src/features/planner/budget-planner-page.jsx packages/validation/src/budget-planner.js
            git commit -m "style(planner): apply repository Prettier"
            git push
          fi
