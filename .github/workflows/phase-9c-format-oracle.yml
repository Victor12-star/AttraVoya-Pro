name: Phase 9C format oracle

on:
  push:
    branches:
      - feature/phase-9c-planner-cursor-pagination

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write \
            apps/server/src/modules/planner/planner-list-cursor.js \
            apps/server/src/modules/planner/planner-list-cursor.test.js \
            apps/server/src/modules/planner/planner-pagination.test.js \
            apps/server/src/modules/planner/planner.routes.js \
            apps/server/src/modules/planner/planner.service.js
          git diff -- \
            apps/server/src/modules/planner/planner-list-cursor.js \
            apps/server/src/modules/planner/planner-list-cursor.test.js \
            apps/server/src/modules/planner/planner-pagination.test.js \
            apps/server/src/modules/planner/planner.routes.js \
            apps/server/src/modules/planner/planner.service.js
