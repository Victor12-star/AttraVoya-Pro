name: Prettier Diagnostic

on:
  push:
    branches:
      - phase-10ebj-maintenance-mode

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier apps/server/src/hooks/maintenance-mode.test.js --write
          git diff -- apps/server/src/hooks/maintenance-mode.test.js
