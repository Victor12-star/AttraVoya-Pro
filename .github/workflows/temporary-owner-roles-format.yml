name: Temporary Owner Roles Formatting
on:
  push:
    branches:
      - feat/owner-admin-role-management
permissions:
  contents: write
jobs:
  format-owner-roles:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format role management changes
        run: |
          pnpm exec prettier --write \
            apps/server/src/modules/users/admin-role.repository.js \
            apps/server/src/modules/users/admin-role.service.js \
            apps/server/src/modules/users/admin-role.controller.js \
            apps/server/src/modules/users/admin-role.test.js \
            apps/server/src/modules/users/users.routes.js \
            apps/server/src/modules/users/users.schema.js \
            apps/server/src/app.js \
            apps/admin/src/app/api/admin/roles/route.js \
            apps/admin/src/features/users/admin-role-form.jsx \
            apps/admin/src/app/dashboard/users/page.jsx
      - name: Commit format-only changes
        run: |
          git add -- \
            apps/server/src/modules/users/admin-role.repository.js \
            apps/server/src/modules/users/admin-role.service.js \
            apps/server/src/modules/users/admin-role.controller.js \
            apps/server/src/modules/users/admin-role.test.js \
            apps/server/src/modules/users/users.routes.js \
            apps/server/src/modules/users/users.schema.js \
            apps/server/src/app.js \
            apps/admin/src/app/api/admin/roles/route.js \
            apps/admin/src/features/users/admin-role-form.jsx \
            apps/admin/src/app/dashboard/users/page.jsx
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(roles): apply repository Prettier formatting'
          git push origin HEAD:feat/owner-admin-role-management
