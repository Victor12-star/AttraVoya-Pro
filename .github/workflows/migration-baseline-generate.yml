name: Migration baseline generator

on:
  push:
    branches:
      - phase-10t-migration-baseline

permissions:
  contents: write

jobs:
  generate:
    name: Generate Prisma baseline SQL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stop when baseline already exists
        id: baseline
        run: |
          if [ -f packages/database/prisma/migrations/0_init/migration.sql ]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        if: steps.baseline.outputs.exists != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        if: steps.baseline.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        if: steps.baseline.outputs.exists != 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate baseline files
        if: steps.baseline.outputs.exists != 'true'
        run: |
          mkdir -p packages/database/prisma/migrations/0_init
          pnpm --filter @attravoya/database exec prisma migrate diff \
            --from-empty \
            --to-schema prisma/schema.prisma \
            --script \
            --output prisma/migrations/0_init/migration.sql
          cat > packages/database/prisma/migrations/migration_lock.toml <<'EOF'
          # Please do not edit this file manually
          # It should be added in your version-control system (i.e. Git)
          provider = "postgresql"
          EOF
          rm -f packages/database/prisma/migrations/.gitkeep

      - name: Commit generated baseline
        if: steps.baseline.outputs.exists != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/prisma/migrations
          git commit -m 'chore: materialize Prisma baseline SQL'
          git push origin HEAD:phase-10t-migration-baseline
