name: Temporary SLO formatter

on:
  push:
    branches:
      - phase-10ebm-slo-evaluator

permissions:
  contents: write

concurrency:
  group: temporary-slo-formatter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: phase-10ebm-slo-evaluator

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format SLO evaluator
        run: pnpm exec prettier --write scripts/slo-evaluator.js

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/slo-evaluator.js; then
            echo "::error::Expected scripts/slo-evaluator.js to change."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/slo-evaluator.js
          git commit -m "style: apply Prettier to SLO evaluator"
          git push origin HEAD:phase-10ebm-slo-evaluator
