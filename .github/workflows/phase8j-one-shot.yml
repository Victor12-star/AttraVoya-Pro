name: Phase 8J one-shot expectation update

on:
  push:
    branches:
      - feature/phase-8j-remaining-cost-evidence-contracts
    paths:
      - scripts/phase8j-update-test-expectations.mjs
      - .github/workflows/phase8j-one-shot.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/phase-8j-remaining-cost-evidence-contracts
      - name: Update existing Phase 8J expectations
        run: node scripts/phase8j-update-test-expectations.mjs
      - name: Remove one-shot helpers
        run: rm scripts/phase8j-update-test-expectations.mjs .github/workflows/phase8j-one-shot.yml
      - name: Commit canonical branch state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/modules/planner/planner-affordability-evidence.test.js scripts/phase8j-update-test-expectations.mjs .github/workflows/phase8j-one-shot.yml
          git commit -m "test: update Phase 8J evidence expectations"
          git push
