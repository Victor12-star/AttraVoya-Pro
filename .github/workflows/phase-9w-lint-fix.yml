name: Phase 9W lint fix

on:
  push:
    branches:
      - feature/phase-9w-itinerary-aware-travel-companion

permissions:
  contents: write

concurrency:
  group: phase-9w-lint-fix
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/phase-9w-itinerary-aware-travel-companion

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply exact lint fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/web/src/features/language/travel-companion-page.jsx';
          let source = fs.readFileSync(path, 'utf8');

          const replacements = [
            [
              "  const companionTrips = tripContextState.data?.trips ?? [];",
              "  const companionTrips = useMemo(\n    () => tripContextState.data?.trips ?? [],\n    [tripContextState.data],\n  );",
            ],
            [
              "  }, []);\n\n  useEffect(() => {\n    if (\n      countriesState.status !== 'success' ||",
              "  }, [setShowToLocalItem]);\n\n  useEffect(() => {\n    if (\n      countriesState.status !== 'success' ||",
            ],
            [
              "    suggestedTripAppliedRef.current = true;\n    setSelectedTripId(suggestedTrip.id);\n    setSelectedCountry(countryCode);\n    void loadPhrasebook(countryCode);",
              "    const currentWindow = browserWindow();\n    const applyTimer = currentWindow?.setTimeout?.(() => {\n      if (manualCountrySelectionRef.current || suggestedTripAppliedRef.current) return;\n      suggestedTripAppliedRef.current = true;\n      setSelectedTripId(suggestedTrip.id);\n      setSelectedCountry(countryCode);\n      void loadPhrasebook(countryCode);\n    }, 0);\n\n    return () => {\n      if (applyTimer !== undefined) currentWindow?.clearTimeout?.(applyTimer);\n    };",
            ],
          ];

          for (const [before, after] of replacements) {
            if (!source.includes(before)) {
              throw new Error(`Expected lint-fix source was not found: ${before.slice(0, 80)}`);
            }
            source = source.replace(before, after);
          }

          fs.writeFileSync(path, source);
          NODE

      - name: Format changed source
        run: pnpm exec prettier --write apps/web/src/features/language/travel-companion-page.jsx

      - name: Commit source change only when needed
        shell: bash
        run: |
          if git diff --quiet -- apps/web/src/features/language/travel-companion-page.jsx; then
            echo "Phase 9W lint source is already fixed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/src/features/language/travel-companion-page.jsx
          git commit -m "Phase 9W: fix Travel Companion React lint"
          git push origin HEAD:feature/phase-9w-itinerary-aware-travel-companion
