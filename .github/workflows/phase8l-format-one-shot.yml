name: Phase 8L one-shot formatter

on:
  push:
    branches:
      - feature/phase-8l-concurrent-evidence-collection

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase-8l-concurrent-evidence-collection
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact Phase 8L test file
        run: pnpm exec prettier --write apps/server/src/modules/planner/planner-remaining-cost-evidence.test.js
      - name: Remove helper and commit clean tree
        run: |
          rm .github/workflows/phase8l-format-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/modules/planner/planner-remaining-cost-evidence.test.js .github/workflows/phase8l-format-one-shot.yml
          git commit -m "style: format Phase 8L concurrency tests"
          git push
