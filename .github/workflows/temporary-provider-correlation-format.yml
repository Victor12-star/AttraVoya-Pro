name: Temporary provider correlation formatting

on:
  push:
    branches:
      - phase-10ebz-provider-request-correlation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: phase-10ebz-provider-request-correlation

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Format provider correlation files
        run: pnpm exec prettier --write apps/server/src/observability/request-context.js apps/server/src/observability/request-context.test.js apps/server/src/hooks/request-context.js apps/server/src/integrations/http/provider-http-client.js apps/server/src/integrations/http/provider-http-client.test.js

      - name: Commit formatted files
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/server/src/observability/request-context.js apps/server/src/observability/request-context.test.js apps/server/src/hooks/request-context.js apps/server/src/integrations/http/provider-http-client.js apps/server/src/integrations/http/provider-http-client.test.js; then
            echo "Files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/observability/request-context.js apps/server/src/observability/request-context.test.js apps/server/src/hooks/request-context.js apps/server/src/integrations/http/provider-http-client.js apps/server/src/integrations/http/provider-http-client.test.js
          git commit -m "style(server): format request correlation slice"
          git push origin HEAD:phase-10ebz-provider-request-correlation
