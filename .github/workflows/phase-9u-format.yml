name: Phase 9U formatter

on:
  push:
    branches:
      - feature/phase-9u-consular-passport

permissions:
  contents: write

concurrency:
  group: phase-9u-formatter
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/phase-9u-consular-passport

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Phase 9U files
        run: >-
          pnpm exec prettier --write
          apps/server/src/integrations/places/place-categories.js
          apps/server/src/integrations/places/place-categories.test.js
          apps/web/src/features/emergency/consular-assistance-copy.js
          apps/web/src/features/emergency/consular-assistance.jsx
          apps/web/tests/unit/consular-assistance.test.jsx
          packages/constants/src/place-categories.js

      - name: Commit formatting only when needed
        shell: bash
        run: |
          if git diff --quiet -- \
            apps/server/src/integrations/places/place-categories.js \
            apps/server/src/integrations/places/place-categories.test.js \
            apps/web/src/features/emergency/consular-assistance-copy.js \
            apps/web/src/features/emergency/consular-assistance.jsx \
            apps/web/tests/unit/consular-assistance.test.jsx \
            packages/constants/src/place-categories.js; then
            echo "Phase 9U files are already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/server/src/integrations/places/place-categories.js \
            apps/server/src/integrations/places/place-categories.test.js \
            apps/web/src/features/emergency/consular-assistance-copy.js \
            apps/web/src/features/emergency/consular-assistance.jsx \
            apps/web/tests/unit/consular-assistance.test.jsx \
            packages/constants/src/place-categories.js
          git commit -m "Phase 9U: apply repository formatting"
          git push origin HEAD:feature/phase-9u-consular-passport
