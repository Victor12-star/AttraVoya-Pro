name: Phase 8I handoff updater

on:
  push:
    branches:
      - feature/phase-8i-affordability-evaluation-policy

permissions:
  contents: write

jobs:
  update-handoff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/phase-8i-affordability-evaluation-policy

      - name: Update permanent handoff
        run: node scripts/phase8i-update-handoff.mjs

      - name: Remove temporary updater files
        run: |
          rm scripts/phase8i-update-handoff.mjs
          rm .github/workflows/phase8i-handoff-update.yml

      - name: Verify documentation diff
        run: git diff --check

      - name: Commit handoff update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: update Phase 8I handoff"
          git push origin HEAD:feature/phase-8i-affordability-evaluation-policy
