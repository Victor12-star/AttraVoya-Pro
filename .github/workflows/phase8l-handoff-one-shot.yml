name: Phase 8L one-shot handoff update

on:
  push:
    branches:
      - feature/phase-8l-concurrent-evidence-collection

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase-8l-concurrent-evidence-collection
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Update permanent handoff
        env:
          PHASE8L_SECTION_B64: 
          OLD_STEPS_B64: 
          NEW_STEPS_B64: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('docs/CURRENT-WORK.md')
          text = path.read_text()
          anchor = '- Live-provider CI must not be overstated as proof of keyed pricing providers that are not configured.\n\n## Mandatory privacy-conscious analytics and admin monitoring phase'
          replacement = base64.b64decode(os.environ['PHASE8L_SECTION_B64']).decode()
          old_steps = base64.b64decode(os.environ['OLD_STEPS_B64']).decode()
          new_steps = base64.b64decode(os.environ['NEW_STEPS_B64']).decode()

          if anchor not in text:
              raise SystemExit('Phase 8K handoff anchor not found')
          if old_steps not in text:
              raise SystemExit('Required-next-steps anchor not found')

          text = text.replace(anchor, replacement, 1)
          text = text.replace(old_steps, new_steps, 1)
          path.write_text(text)
          PY
      - name: Format handoff
        run: pnpm exec prettier --write docs/CURRENT-WORK.md
      - name: Remove helper and commit clean tree
        run: |
          rm .github/workflows/phase8l-handoff-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT-WORK.md .github/workflows/phase8l-handoff-one-shot.yml
          git commit -m "docs: update handoff through Phase 8L"
          git push
