name: Phase 9S lockfile refresh

on:
  push:
    branches:
      - phase-9s-rate-limit-ipv6-security

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-9s-rate-limit-ipv6-security
      - name: Enable Corepack
        run: corepack enable
      - name: Activate pinned pnpm
        run: corepack prepare pnpm@11.22.0 --activate
      - name: Refresh lockfile
        run: pnpm install --lockfile-only
      - name: Commit lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh lockfile for rate-limit security patch"
          git push origin HEAD:phase-9s-rate-limit-ipv6-security
