name: Temporary dependency and formatting repair
on:
  push:
    branches:
      - fix/planner-validation-feedback
    paths:
      - .github/workflows/temp-planner-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Regenerate lockfile without scripts
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Apply project formatting
        run: pnpm exec prettier --write apps/web/src/features/planner/budget-planner-page.jsx apps/web/tests/unit/budget-planner-page.test.jsx pnpm-workspace.yaml
      - name: Commit regenerated lockfile and formatting
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml pnpm-workspace.yaml apps/web/src/features/planner/budget-planner-page.jsx apps/web/tests/unit/budget-planner-page.test.jsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml pnpm-workspace.yaml apps/web/src/features/planner/budget-planner-page.jsx apps/web/tests/unit/budget-planner-page.test.jsx
            git commit -m "chore: regenerate patched lockfile and apply Prettier"
            git push
          fi
