name: Temporary Security Formatting

on:
  push:
    branches:
      - feat/admin-password-security

permissions:
  contents: write

jobs:
  format-security:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format scoped security changes
        run: |
          pnpm exec prettier --write \
            apps/server/src/modules/auth/auth.schema.js \
            apps/server/src/modules/auth/auth.routes.js \
            apps/server/src/modules/auth/auth.controller.js \
            apps/server/src/modules/auth/auth.repository.js \
            apps/server/src/modules/auth/auth.service.js \
            apps/server/src/modules/auth/auth.change-password.test.js \
            apps/admin/src/app/api/admin/change-password/route.js \
            apps/admin/src/features/auth/change-password-form.jsx \
            apps/admin/src/app/dashboard/security/page.jsx \
            apps/admin/src/app/dashboard/layout.jsx \
            apps/admin/src/app/dashboard/page.jsx
      - name: Commit formatting
        run: |
          git add -- apps/server/src/modules/auth apps/admin/src/app/api/admin/change-password/route.js \
            apps/admin/src/features/auth/change-password-form.jsx \
            apps/admin/src/app/dashboard/security/page.jsx \
            apps/admin/src/app/dashboard/layout.jsx \
            apps/admin/src/app/dashboard/page.jsx
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(security): apply repository Prettier formatting'
          git push origin HEAD:feat/admin-password-security
