name: Phase 9W test format

on:
  push:
    branches:
      - feature/phase-9w-itinerary-aware-travel-companion

permissions:
  contents: write

concurrency:
  group: phase-9w-test-format
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/phase-9w-itinerary-aware-travel-companion

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format trip-context test
        run: pnpm exec prettier --write apps/web/tests/unit/travel-companion-trip-context.test.jsx

      - name: Commit formatting only when needed
        shell: bash
        run: |
          if git diff --quiet -- apps/web/tests/unit/travel-companion-trip-context.test.jsx; then
            echo "Trip-context test is already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/web/tests/unit/travel-companion-trip-context.test.jsx
          git commit -m "Phase 9W: format trip-context test"
          git push origin HEAD:feature/phase-9w-itinerary-aware-travel-companion
