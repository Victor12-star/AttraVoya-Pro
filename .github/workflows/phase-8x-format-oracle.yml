name: Phase 8X format oracle

on:
  push:
    branches:
      - feature/phase-8x-provider-cache-metrics

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write \
            apps/server/src/integrations/http/provider-cache-metrics.test.js \
            apps/server/src/observability/provider-cache-metrics.test.js
          git diff -- \
            apps/server/src/integrations/http/provider-cache-metrics.test.js \
            apps/server/src/observability/provider-cache-metrics.test.js
