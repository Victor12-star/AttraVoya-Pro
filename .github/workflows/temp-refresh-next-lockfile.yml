name: Temporary Next.js security lockfile refresh

on:
  push:
    branches:
      - fix/staging-disabled-provider-registries
    paths:
      - apps/web/package.json
      - apps/admin/package.json

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/staging-disabled-provider-registries
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
      - name: Regenerate pnpm dependency lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit the reviewed lockfile update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(security): lock patched Next.js dependencies"
            git push origin HEAD:fix/staging-disabled-provider-registries
          fi
