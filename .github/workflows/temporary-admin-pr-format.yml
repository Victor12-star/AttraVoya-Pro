name: Temporary Admin PR Formatting

on:
  push:
    branches:
      - fix/admin-secure-sign-in-bff

permissions:
  contents: write

jobs:
  format-admin-pr:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact changed admin files
        run: |
          pnpm exec prettier --write \
            apps/admin/src/app/api/admin/analytics/route.js \
            apps/admin/src/app/api/admin/login/route.js \
            apps/admin/src/app/globals.css \
            apps/admin/src/app/login/page.jsx \
            apps/admin/src/features/auth/admin-logout-button.jsx \
            apps/admin/tests/unit/admin-login.test.jsx
      - name: Commit only formatting changes
        run: |
          git add -- \
            apps/admin/src/app/api/admin/analytics/route.js \
            apps/admin/src/app/api/admin/login/route.js \
            apps/admin/src/app/globals.css \
            apps/admin/src/app/login/page.jsx \
            apps/admin/src/features/auth/admin-logout-button.jsx \
            apps/admin/tests/unit/admin-login.test.jsx
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(admin): apply repository Prettier formatting'
          git push origin HEAD:fix/admin-secure-sign-in-bff
