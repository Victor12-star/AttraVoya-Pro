name: Phase 8A formatter recovery

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: phase-8a-formatter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Apply exact Phase 8A formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply exact Prettier 3.9.6 output
        run: >-
          pnpm exec prettier --write
          apps/web/src/features/planner/budget-planner-copy.js
          apps/web/src/features/planner/budget-planner-page.jsx
          apps/web/tests/unit/budget-planner-page.test.jsx

      - name: Restore canonical formatter and commit formatted files
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git fetch origin develop
          git show origin/develop:package.json > package.json
          git add \
            package.json \
            apps/web/src/features/planner/budget-planner-copy.js \
            apps/web/src/features/planner/budget-planner-page.jsx \
            apps/web/tests/unit/budget-planner-page.test.jsx

          if git diff --cached --quiet; then
            echo "No formatter changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply exact Phase 8A formatting"
          git push origin "HEAD:${HEAD_BRANCH}"
