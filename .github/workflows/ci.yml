name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  API_HOST: 127.0.0.1
  API_PORT: 5000
  LOG_LEVEL: silent
  WEB_URL: http://localhost:3000
  ADMIN_URL: http://localhost:3001
  API_URL: http://localhost:5000
  DATABASE_URL: postgresql://attravoya:attravoya_ci_password@127.0.0.1:5432/attravoya_ci?schema=public
  JWT_ACCESS_SECRET: ci-jwt-access-secret-attravoya-pro-0123456789abcdef
  COOKIE_SECRET: ci-cookie-secret-attravoya-pro-0123456789abcdef
  DATA_ENCRYPTION_KEY: ci-data-encryption-key-attravoya-pro-0123456789abcdef
  JWT_ACCESS_TTL: 15m
  AUTH_REFRESH_SESSION_DAYS: 30
  JWT_ISSUER: attravoya-pro-api
  JWT_AUDIENCE: attravoya-pro
  LIBRETRANSLATE_URL: http://127.0.0.1:5001
  WEATHER_PROVIDER: openmeteo
  CURRENCY_PROVIDER: frankfurter
  TRANSLATION_PROVIDER: libretranslate
  MAPS_PROVIDER: geoapify
  PLACES_PROVIDER: geoapify
  GEOCODING_PROVIDER: geoapify
  ROUTING_PROVIDER: geoapify
  ACCOMMODATION_PROVIDER: geoapify
  EVENTS_PROVIDER: ticketmaster
  NEWS_PROVIDER: newsdata
  IMAGE_PROVIDER: pexels
  EMAIL_PROVIDER: resend
  FLIGHT_PROVIDER: none

jobs:
  quality:
    name: Code quality and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate environment contract
        run: pnpm env:check

      - name: Generate Prisma client for JavaScript checks
        run: pnpm db:generate

      - name: Check JavaScript
        run: pnpm check:js

      - name: Check translations
        run: pnpm translations:check

      - name: Check professional presentation
        run: pnpm presentation:check

      - name: Run provider smoke tests
        run: pnpm providers:smoke

      - name: Lint
        run: pnpm lint

      - name: Test HTTP load harness
        run: pnpm load:harness:test

      - name: Run unit tests
        run: pnpm test

      - name: Install Playwright browsers
        run: |
          # GitHub's Ubuntu image includes an unrelated Google Chrome apt source.
          # Playwright installs its own browser binaries; disabling this runner-only
          # source avoids external Chrome-repository index races without skipping
          # Playwright's Ubuntu dependency installation or browser coverage.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          pnpm --filter @attravoya/web exec playwright install --with-deps chromium firefox webkit

      - name: Run web browser smoke and accessibility tests
        env:
          NODE_ENV: development
        run: pnpm --filter @attravoya/web test:e2e:ci

      - name: Check formatting
        run: pnpm format:check

  database:
    name: PostgreSQL and Prisma verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: attravoya_ci
          POSTGRES_USER: attravoya
          POSTGRES_PASSWORD: attravoya_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U attravoya -d attravoya_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Validate Prisma schema
        run: pnpm --filter @attravoya/database validate:schema

      - name: Apply migrations to disposable CI database
        run: pnpm db:deploy

      - name: Verify migration status
        run: pnpm --filter @attravoya/database migrate:status

      - name: Verify deployed schema matches Prisma schema
        run: |
          pnpm --filter @attravoya/database exec prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code

      - name: Seed reference data
        run: pnpm db:seed

      - name: Verify PostgreSQL backup and restore
        env:
          POSTGRES_RECOVERY_TEST: '1'
        run: pnpm db:recovery:test

      - name: Run database tests
        run: pnpm --filter @attravoya/database test

      - name: Verify API graceful restart and database recovery
        env:
          API_RESTART_RECOVERY_TEST: '1'
        run: pnpm api:restart:check

      - name: Verify API early-load capacity and overload backpressure
        run: |
          set -euo pipefail

          log_file="/tmp/attravoya-capacity-api.log"
          node apps/server/src/server.js >"$log_file" 2>&1 &
          api_pid=$!

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              cat "$log_file" || true
            fi
            if kill -0 "$api_pid" 2>/dev/null; then
              kill -TERM "$api_pid" 2>/dev/null || true
              for attempt in {1..20}; do
                if ! kill -0 "$api_pid" 2>/dev/null; then
                  break
                fi
                sleep 0.25
              done
              kill -KILL "$api_pid" 2>/dev/null || true
            fi
            wait "$api_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/api/v1/health/ready >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              echo "API exited before becoming ready."
              exit 1
            fi
            echo "Waiting for API readiness ($attempt/30)..."
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "API did not become ready within 30 seconds."
            exit 1
          fi

          pnpm capacity:check

          if ! kill -0 "$api_pid" 2>/dev/null; then
            echo "API exited during the capacity/backpressure check."
            exit 1
          fi

          echo "API capacity/backpressure contract passed."

      - name: Verify bounded soak and spike resilience
        run: |
          set -euo pipefail

          log_file="/tmp/attravoya-resilience-api.log"
          node apps/server/src/server.js >"$log_file" 2>&1 &
          api_pid=$!

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              cat "$log_file" || true
            fi
            if kill -0 "$api_pid" 2>/dev/null; then
              kill -TERM "$api_pid" 2>/dev/null || true
              for attempt in {1..20}; do
                if ! kill -0 "$api_pid" 2>/dev/null; then
                  break
                fi
                sleep 0.25
              done
              kill -KILL "$api_pid" 2>/dev/null || true
            fi
            wait "$api_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/api/v1/health/ready >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              echo "API exited before becoming ready for resilience testing."
              exit 1
            fi
            echo "Waiting for API resilience-test readiness ($attempt/30)..."
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "API did not become ready for resilience testing within 30 seconds."
            exit 1
          fi

          pnpm resilience:check

          if ! kill -0 "$api_pid" 2>/dev/null; then
            echo "API exited during the bounded soak/spike check."
            exit 1
          fi

          echo "API bounded soak/spike resilience contract passed."

      - name: Verify database pool exhaustion behavior
        env:
          DATABASE_POOL_EXHAUSTION_TEST: '1'
        run: pnpm --filter @attravoya/database test:pool-exhaustion

  build:
    name: Production builds
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build workspace
        run: pnpm build

      - name: Build and smoke-test API container
        run: |
          set -euo pipefail

          image="attravoya-api:ci"
          container="attravoya-api-ci"

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs "$container" || true
            fi
            docker rm --force "$container" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          docker build --file apps/server/Dockerfile --tag "$image" .

          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = "node"
          docker image inspect "$image" --format '{{json .Config.Env}}' | grep -F '"NODE_ENV=production"' >/dev/null
          docker image inspect "$image" --format '{{json .Config.Env}}' | grep -F '"API_HOST=0.0.0.0"' >/dev/null
          docker image inspect "$image" --format '{{json .Config.Env}}' | grep -F '"API_PORT=5000"' >/dev/null
          docker image inspect "$image" --format '{{json .Config.Healthcheck.Test}}' | grep -F '/api/v1/health/live' >/dev/null

          docker run --detach --name "$container" \
            --publish 127.0.0.1:5050:5000 \
            --env NODE_ENV=test \
            --env API_HOST=0.0.0.0 \
            --env API_PORT=5000 \
            --env WEB_URL \
            --env ADMIN_URL \
            --env API_URL \
            --env DATABASE_URL \
            --env JWT_ACCESS_SECRET \
            --env COOKIE_SECRET \
            --env DATA_ENCRYPTION_KEY \
            "$image"

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5050/api/v1/health/live > /tmp/attravoya-api-health.json; then
              node -e "const fs = require('node:fs'); const health = JSON.parse(fs.readFileSync('/tmp/attravoya-api-health.json', 'utf8')); if (health.status !== 'ok' || health.service !== 'attravoya-api') process.exit(1);"
              echo "API container liveness contract passed."
              exit 0
            fi

            if [ "$(docker inspect "$container" --format '{{.State.Running}}' 2>/dev/null || true)" != "true" ]; then
              echo "API container exited before becoming live."
              exit 1
            fi

            echo "Waiting for API container ($attempt/30)..."
            sleep 1
          done

          echo "API container did not become live within 30 seconds."
          exit 1

  live-providers:
    name: Live no-cost provider checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local LibreTranslate
        run: |
          docker run -d --name attravoya-libretranslate \
            -p 5001:5000 \
            -e LT_DISABLE_WEB_UI=true \
            -e LT_DISABLE_FILES_TRANSLATION=true \
            -e LT_LOAD_ONLY=en,es \
            -e LT_UPDATE_MODELS=false \
            libretranslate/libretranslate:v1.9.6

      - name: Wait for LibreTranslate
        run: |
          for attempt in {1..36}; do
            if curl --fail --silent http://127.0.0.1:5001/languages >/dev/null; then
              echo "LibreTranslate is ready."
              exit 0
            fi
            echo "Waiting for LibreTranslate ($attempt/36)..."
            sleep 10
          done
          docker logs attravoya-libretranslate
          exit 1

      - name: Run live provider checks
        env:
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/live-provider-check.js

      - name: Show LibreTranslate logs on failure
        if: failure()
        run: docker logs attravoya-libretranslate || true

  security:
    name: Dependency and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan tracked files for common secret patterns
        run: node scripts/secret-scan.js

      - name: Audit production dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm audit --prod --audit-level=high; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency audit failed after 3 attempts."
              exit 1
            fi
            echo "Dependency audit attempt $attempt failed; retrying after a short delay."
            sleep $((attempt * 10))
          done