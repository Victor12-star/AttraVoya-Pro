name: Phase 10AA Prettier diagnostic

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  format-diagnostic:
    name: Capture exact Prettier output
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format accommodation gallery with repository Prettier
        run: pnpm exec prettier apps/web/src/features/destinations/accommodation-page.jsx --write

      - name: Upload exact formatted source
        uses: actions/upload-artifact@v4
        with:
          name: phase-10aa-prettier-output
          path: apps/web/src/features/destinations/accommodation-page.jsx
          if-no-files-found: error
          retention-days: 1
