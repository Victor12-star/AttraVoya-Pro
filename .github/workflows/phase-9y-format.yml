name: Phase 9Y format

on:
  push:
    branches:
      - feature/phase-9y-admin-service-metrics

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/phase-9y-admin-service-metrics

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository Prettier formatting
        run: pnpm exec prettier --write apps/server/src/modules/operations/service-metrics.routes.js

      - name: Commit canonical formatting if needed
        run: |
          if git diff --quiet -- apps/server/src/modules/operations/service-metrics.routes.js; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/modules/operations/service-metrics.routes.js
          git commit -m "Phase 9Y: apply canonical formatting"
          git push origin HEAD:feature/phase-9y-admin-service-metrics
