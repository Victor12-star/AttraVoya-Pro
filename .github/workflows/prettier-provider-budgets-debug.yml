name: Provider budgets formatting diagnostic

on:
  push:
    branches:
      - phase-10v-provider-budgets

permissions:
  contents: read

jobs:
  prettier:
    name: Show provider budgets formatting diff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show Prettier diff
        run: |
          pnpm exec prettier \
            apps/server/src/app.js \
            apps/server/src/config/env.js \
            apps/server/src/config/env.provider-request-budget.test.js \
            apps/server/src/integrations/http/provider-http-client-budget.test.js \
            apps/server/src/integrations/http/provider-http-client.js \
            apps/server/src/integrations/http/provider-request-budget.js \
            apps/server/src/integrations/http/provider-request-budget.test.js \
            docs/PROVIDER-REQUEST-BUDGETS.md \
            --write
          git diff -- \
            apps/server/src/app.js \
            apps/server/src/config/env.js \
            apps/server/src/config/env.provider-request-budget.test.js \
            apps/server/src/integrations/http/provider-http-client-budget.test.js \
            apps/server/src/integrations/http/provider-http-client.js \
            apps/server/src/integrations/http/provider-request-budget.js \
            apps/server/src/integrations/http/provider-request-budget.test.js \
            docs/PROVIDER-REQUEST-BUDGETS.md
