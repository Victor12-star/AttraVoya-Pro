name: Temporary Admin Invitation Tracking Format
on:
  push:
    branches:
      - feat/admin-invitation-tracking
permissions:
  contents: write
jobs:
  format-tracking:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format invitation tracking changes
        run: |
          pnpm exec prettier --write \
            packages/database/prisma/schema.prisma \
            apps/server/src/modules/users/admin-invite.repository.js \
            apps/server/src/modules/users/admin-invite.service.js \
            apps/server/src/modules/users/admin-invite.controller.js \
            apps/server/src/modules/users/admin-invite.test.js \
            apps/server/src/modules/users/users.routes.js \
            apps/server/src/modules/users/users.schema.js \
            apps/admin/src/app/api/admin/invitations/route.js \
            'apps/admin/src/app/api/admin/invitations/[invitationId]/revoke/route.js' \
            apps/admin/src/features/users/admin-invitation-history.jsx \
            apps/admin/src/app/dashboard/users/page.jsx
      - name: Commit scoped formatting
        run: |
          git add -- packages/database/prisma/schema.prisma \
            apps/server/src/modules/users/admin-invite.repository.js \
            apps/server/src/modules/users/admin-invite.service.js \
            apps/server/src/modules/users/admin-invite.controller.js \
            apps/server/src/modules/users/admin-invite.test.js \
            apps/server/src/modules/users/users.routes.js \
            apps/server/src/modules/users/users.schema.js \
            apps/admin/src/app/api/admin/invitations/route.js \
            'apps/admin/src/app/api/admin/invitations/[invitationId]/revoke/route.js' \
            apps/admin/src/features/users/admin-invitation-history.jsx \
            apps/admin/src/app/dashboard/users/page.jsx
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(admin): format invitation tracking'
          git push origin HEAD:feat/admin-invitation-tracking
