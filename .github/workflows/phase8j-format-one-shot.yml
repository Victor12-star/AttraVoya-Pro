name: Phase 8J one-shot formatting

on:
  push:
    branches:
      - feature/phase-8j-remaining-cost-evidence-contracts
    paths:
      - .github/workflows/phase8j-format-one-shot.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/phase-8j-remaining-cost-evidence-contracts
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply canonical Prettier formatting
        run: pnpm exec prettier --write apps/server/src/modules/planner/planner-remaining-cost-evidence.test.js apps/server/src/modules/planner/pricing-evidence.js
      - name: Verify formatted files
        run: pnpm exec prettier --check apps/server/src/modules/planner/planner-remaining-cost-evidence.test.js apps/server/src/modules/planner/pricing-evidence.js
      - name: Remove one-shot workflow
        run: rm .github/workflows/phase8j-format-one-shot.yml
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/modules/planner/planner-remaining-cost-evidence.test.js apps/server/src/modules/planner/pricing-evidence.js .github/workflows/phase8j-format-one-shot.yml
          git commit -m "style: apply canonical Phase 8J formatting"
          git push
