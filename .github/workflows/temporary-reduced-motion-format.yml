name: Temporary reduced-motion formatting

on:
  push:
    branches:
      - phase-10ebt-web-reduced-motion-regression

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: phase-10ebt-web-reduced-motion-regression

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Format reduced-motion test
        run: pnpm exec prettier --write apps/web/tests/e2e/public-home.spec.js

      - name: Commit formatted test
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/web/tests/e2e/public-home.spec.js; then
            echo "File already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests/e2e/public-home.spec.js
          git commit -m "style(web): apply repository prettier formatting"
          git push origin HEAD:phase-10ebt-web-reduced-motion-regression
