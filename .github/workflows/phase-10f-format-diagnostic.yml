name: Phase 10F formatting diagnostic

on:
  push:
    branches:
      - feature/phase-10f-runtime-saturation-metrics

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show exact Prettier correction
        run: |
          pnpm exec prettier --write apps/server/src/observability/runtime-metrics.js
          git diff -- apps/server/src/observability/runtime-metrics.js
