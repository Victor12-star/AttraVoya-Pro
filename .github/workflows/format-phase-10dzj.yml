name: Format Phase 10DZJ files

on:
  push:
    branches:
      - phase-10dzj-android-purchase-availability

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: phase-10dzj-android-purchase-availability

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format edited files
        run: |
          pnpm exec prettier --write \
            apps/server/src/modules/payments/payments.routes.js \
            apps/server/src/tests/integration/revenuecat-identity.test.js

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/modules/payments/payments.routes.js apps/server/src/tests/integration/revenuecat-identity.test.js
          git commit -m "style: format Android purchase availability"
          git push origin HEAD:phase-10dzj-android-purchase-availability
