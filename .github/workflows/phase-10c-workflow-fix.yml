name: Phase 10C workflow repair

on:
  push:
    branches:
      - feature/phase-10c-provider-total-deadline

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/phase-10c-provider-total-deadline

      - name: Repair temporary patch harness
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/phase-10c-patch.yml')
          text = path.read_text()
          old = """      - name: Run focused provider deadline tests
        run: pnpm --filter @attravoya/server test -- provider-http-client-deadline.test.js
"""
          new = """      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run focused provider deadline tests
        run: pnpm --filter @attravoya/server exec vitest run src/integrations/http/provider-http-client-deadline.test.js --passWithNoTests
"""
          if text.count(old) != 1:
              raise SystemExit('Temporary patch workflow test block was not found exactly once.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit repaired harness
        run: |
          if git diff --quiet -- .github/workflows/phase-10c-patch.yml; then
            echo "Harness already repaired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/phase-10c-patch.yml
          git commit -m "Phase 10C: repair temporary test harness"
          git push origin HEAD:feature/phase-10c-provider-total-deadline
