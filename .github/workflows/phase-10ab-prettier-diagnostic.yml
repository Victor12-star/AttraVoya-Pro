name: Phase 10AB Prettier diagnostic

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  format-diagnostic:
    name: Show exact Prettier diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show exact formatter changes
        run: |
          pnpm exec prettier apps/web/src/features/destinations/accommodation-page.jsx --write
          git diff -- apps/web/src/features/destinations/accommodation-page.jsx
