name: Phase 8H handoff updater

on:
  push:
    branches:
      - feature/phase-8h-planner-candidate-evidence-ui

permissions:
  contents: write

jobs:
  update-handoff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/phase-8h-planner-candidate-evidence-ui

      - name: Update permanent handoff
        run: python scripts/phase8h-handoff-update.py

      - name: Remove temporary updater files
        run: |
          rm scripts/phase8h-handoff-update.py
          rm .github/workflows/phase8h-handoff-update.yml

      - name: Verify documentation diff
        run: git diff --check

      - name: Commit handoff update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: update Phase 8H handoff"
          git push origin HEAD:feature/phase-8h-planner-candidate-evidence-ui
